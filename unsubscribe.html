<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Unsubscribe...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #4EBCCA;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .message {
            color: #4a5568;
            font-size: 16px;
            margin-top: 20px;
        }
        .error {
            color: #c53030;
            display: none;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #fed7d7;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="message">Redirecting to unsubscribe page...</div>
    <div class="error" id="errorMessage">
        An error occurred. Please try again later.
    </div>

    <script>
        // Function to get URL parameters
        function getEmailFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('email');
        }

        // Function to show error
        function showError(message) {
            document.querySelector('.loader').style.display = 'none';
            document.querySelector('.message').style.display = 'none';
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        // Main redirect function
        function redirectToUnsubscribe() {
            const email = getEmailFromURL();
            
            if (!email) {
                showError('Email parameter is missing from the URL.');
                return;
            }

            // Redirect to Google Apps Script
            const appScriptUrl = 'https://script.google.com/macros/s/AKfycbw33NAAbKDUlOJ8yuOEbesEZ9hSD47YEm-qCJsnDtMWoqRCH1DuFgWxBzTwClPyYvnQ/exec';
            window.location.href = `${appScriptUrl}?email=${encodeURIComponent(email)}`;
        }

        // Execute redirect on page load
        window.onload = redirectToUnsubscribe;
    </script>
</body>
</html>
